# LLM Configuration Properties
llm.base-url=${LLM_BASE_URL:http://localhost:8080/v1}
llm.backend=${LLM_BACKEND:local}
llm.providers.local.base-url=${LLM_LOCAL_BASE_URL:http://localhost:8080/v1}
llm.providers.local.model=${LLM_LOCAL_MODEL:qwen3-4b}
llm.providers.pi-ssh.base-url=${LLM_PI_SSH_BASE_URL:http://piworm.local:8090/v1}
llm.providers.pi-ssh.model=${LLM_PI_SSH_MODEL:/home/dietpi/.synapse/models/Qwen3.5-2B_Q4_k_m.gguf}
llm.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
llm.providers.openai.model=${OPENAI_MODEL:gpt-4o}
llm.providers.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
llm.providers.ollama.model=${OLLAMA_MODEL:qwen3.5:4b}
llm.llama-cpp.model=${LLAMACPP_MODEL:/home/dietpi/.synapse/models/Qwen3.5-2B_Q4_k_m.gguf}
llm.pdf.base-url=${LLM_PDF_BASE_URL:}
llm.pdf.model=${LLM_PDF_MODEL:gemma-4-E2B}
llm.temperature=0.0
llm.timeout=30000
llm.cot.enabled=false
# Outer deadline for one LLM stage call; lower for fast backends (default 2880s suits CPU llama.cpp)
llm.stage-timeout=${LLM_STAGE_TIMEOUT:2880s}
# reasoning_effort for the generic client (blank = omit); Ollama gets "none" automatically
llm.reasoning-effort=${LLM_REASONING_EFFORT:}
llm.providers.ollama.reasoning-effort=${LLM_OLLAMA_REASONING_EFFORT:none}

# Laya local sentiment pre-filter (FastAPI service on a Mac M1, see laya-service/).
# Ships disabled — new and unvalidated. Enable only after laya-service is confirmed
# reachable and its response shape verified (see laya-service/README.md).
laya.enabled=${LAYA_ENABLED:false}
laya.shadow-mode=${LAYA_SHADOW_MODE:true}
laya.confidence-threshold=${LAYA_CONFIDENCE_THRESHOLD:0.75}
laya.timeout=${LAYA_TIMEOUT:5s}
laya.service.url=${LAYA_SERVICE_URL:}
laya.service.api-key=${LAYA_SERVICE_API_KEY:}

# Spring AI — OpenAI-compatible client (any /v1 endpoint)
# Disable all autoconfigs — we create beans manually for GPUHub endpoint
spring.ai.openai.chat.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.base-url=
spring.ai.openai.api-key=none
spring.ai.openai.chat.options.model=claude-sonnet-4-6

# News Ingestion Configuration
news.nse.endpoint=https://nseindia.com/api/corporate-announcements
news.google-rss.url=https://news.google.com/rss
news.fetch-limit=50

# News Source Configuration
news.source.timeout=10
news.source.moneycontrol.enabled=true
news.source.moneycontrol.max-articles=15
news.source.et.enabled=true
news.source.et.max-articles=15
news.source.google.enabled=true
news.source.google.max-articles=20
news.source.nse.enabled=true
news.source.bse.enabled=true
news.source.reddit.enabled=true
news.source.reddit.max-articles=15
news.source.finnhub.enabled=true
news.source.finnhub.max-articles=15

# Reddit OAuth (personal use script — client_id + client_secret only)
news.reddit.client-id=${REDDIT_CLIENT_ID:}
news.reddit.client-secret=${REDDIT_CLIENT_SECRET:}
news.reddit.username=${REDDIT_USERNAME:}
news.reddit.password=${REDDIT_PASSWORD:}

