# =============================================================================
# Swing Trade Application - Local E2E Gate Profile
# =============================================================================
# Used by `bin/e2e-gate` (also reachable as `./dev-stack.sh gate`) for the
# hermetic Docker end-to-end gate: disposable database, Flyway-migrated schema,
# every background scheduler switched off, no outbound provider calls.
#
# The goal is determinism. A gate that races the candidate-scan scheduler or a
# news backfill is a gate whose failures are untrustworthy, so anything that
# reaches the network or the clock on its own is disabled here. Everything the
# gate asserts must be caused by the gate.
#
# Never use this profile for development or deployment.
# =============================================================================

server.port=8080

# =============================================================================
# Database — disposable, Flyway-migrated, validated against the entities
# =============================================================================
# ddl-auto=validate (inherited) is deliberate: if a migration and an @Entity
# drift apart, the API refuses to start and the gate fails. That is the check.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:swingtrade_e2e}?currentSchema=public
spring.datasource.username=${DB_USER:swingtrade_user}
spring.datasource.password=${DB_PASSWORD:swingtrade_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# =============================================================================
# Everything that would act on its own is off. The gate drives these paths
# explicitly over HTTP; nothing may run behind the gate's back.
# =============================================================================
app.features.scheduler.enabled=false
app.features.candidate-scan.scheduler.enabled=false
app.features.data-ingestion.enabled=false
app.features.strategy.enabled=true
app.features.sentiment-analysis.enabled=true
app.features.paper-trading.enabled=true
app.features.real-trading.enabled=false

job.orchestrator.llm-analysis.enabled=false
job.orchestrator.reaper.enabled=false
job.orchestrator.max-concurrent=1

app.monitoring.enabled=false
candidate-scan.delay-ms=0
ingestion.default-years=1

# No provider traffic from a gate run.
news.source.moneycontrol.enabled=false
news.source.et.enabled=false
news.source.google.enabled=false
news.source.nse.enabled=false
news.source.bse.enabled=false
news.source.reddit.enabled=false
news.source.finnhub.enabled=false

# =============================================================================
# Trading — paper only, never a live broker
# =============================================================================
trading.enabled=false
trading.paper.trading.enabled=true
real.trading.enabled=false
trading.simulation.mode=true
trading.max.position.size.percentage=5
trading.max.exposure.percentage=25
trading.stop.loss.percentage=3.0
trading.take.profit.percentage=10.0

ingestion.reconcile.apply.enabled=false

# =============================================================================
# LLM — unreachable on purpose. Nothing may call a model in a gate run, and if
# something tries, it fails fast against a dead host instead of stalling.
# =============================================================================
llm.enabled=false
llm.backend=local
llm.base-url=http://127.0.0.1:1/v1
llm.providers.local.base-url=http://127.0.0.1:1/v1
llm.providers.ollama.base-url=http://127.0.0.1:1/v1
llm.providers.pi-ssh.base-url=http://127.0.0.1:1/v1
llm.providers.openai.base-url=http://127.0.0.1:1/v1
llm.providers.laya.base-url=http://127.0.0.1:1/v1
llm.gpuhub.base-url=http://127.0.0.1:1/v1
llm.pdf.base-url=
spring.ai.openai.base-url=http://127.0.0.1:1/v1
spring.ai.openai.api-key=gate-not-needed

# =============================================================================
# Notifications, brokers, docs — all off
# =============================================================================
signal.enabled=false
telegram.bot.enabled=false
discord.webhook.enabled=false
discord.webhook.url=
gpuhub.api.api-key=
fyers.clientId=
fyers.secretKey=
fyers.pin=
fyers.accessToken=
fyers.refreshToken=
fyers.tokenStorePath=/app/data/fyers-tokens.json
upstox.client-id=
upstox.client-secret=
upstox.access-token=

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.security.filter.enabled=false
spring.security.oauth2.client.registration.google.client-id=

# =============================================================================
# Security — admin routes stay behind the shared key so the gate proves the
# boundary; the key is generated per run and never reused.
# =============================================================================
app.security.api-key.enabled=${API_KEY_AUTH_ENABLED:true}
app.security.api-key=${API_KEY:}
app.security.public-rate-limit-per-minute=${API_PUBLIC_RATE_LIMIT_PER_MINUTE:1000}

spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3003,http://127.0.0.1:3003,http://localhost:18081,http://piworm.local:18081}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allowed-credentials=true

# =============================================================================
# Actuator — the gate's readiness probe
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livelystate.enabled=true
management.health.readystate.enabled=true
# Readiness must include the datasource. Without this, readiness reports UP as
# soon as the web layer is up and the gate would start asserting against an API
# whose database is not connected yet.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10485760
management.prometheus.metrics.export.enabled=false

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.com.swingtrade=INFO
logging.level.com.swingtrade.api=INFO
logging.level.com.swingtrade.data=INFO
logging.level.com.swingtrade.strategy=INFO
logging.level.com.swingtrade.llm=INFO
logging.level.com.swingtrade.broker=INFO
logging.level.com.swingtrade.core=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.file.name=${LOG_FILE:/var/log/swing-trade/gate.log}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n