# Watchlist shadow mirroring - disabled by default.
# Java stays the primary response; the mirrored Go response is discarded.
# Activation: uncomment the two map entries below exactly as documented in
# docs/plans/go-migration/watchlist-shadow.md. proxy_pass uses a variable, so
# runtime DNS comes from Docker's embedded resolver.
resolver 127.0.0.11 valid=5s ipv6=off;

# $request_uri keeps the original request path inside mirror subrequests ($uri does not).
map $request_uri $watchlist_mirror_path {
    default $request_uri;
    "~^([^?]*)" $1;
}

map "$request_method $watchlist_mirror_path" $watchlist_mirror_target {
    default "";
    # Activation: uncomment exactly these two lines to mirror the two watchlist reads.
    # "GET /api/watchlist"     http://swing-trade-go-shadow-api:8080;
    # "GET /api/watchlist/all" http://swing-trade-go-shadow-api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Actuator health/metrics to backend
    location /api/actuator/ {
        proxy_pass http://swing-trade-stage-api:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy health endpoint to backend actuator
    location = /api/health {
        proxy_pass http://swing-trade-stage-api:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health/full {
        proxy_pass http://swing-trade-stage-api:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Watchlist reads: Java remains primary; the optional shadow mirror is off by default.
    location = /api/watchlist {
        mirror /go_watchlist_mirror;
        mirror_request_body off;
        proxy_pass http://swing-trade-stage-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /api/watchlist/all {
        mirror /go_watchlist_mirror;
        mirror_request_body off;
        proxy_pass http://swing-trade-stage-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Internal mirror target: with mirroring disabled an empty map target answers
    # 204 without contacting any backend, so a default deploy never reaches Go.
    location = /go_watchlist_mirror {
        internal;
        if ($watchlist_mirror_target = "") { return 204; }
        proxy_pass $watchlist_mirror_target$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend (pass full URI as-is)
    location /api/ {
        proxy_pass http://swing-trade-stage-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy Fyers auth callbacks
    location /fyers/ {
        proxy_pass http://swing-trade-stage-api:8080/fyers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}