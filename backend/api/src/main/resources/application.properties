# =============================================================================
# Environment-Specific Overrides
# =============================================================================
# Use application-{profile}.properties for environment-specific settings
# Load order: application.properties -> application-{profile}.properties

# =============================================================================
# Resilience4j — Circuit Breaker, Retry, Bulkhead, Time Limiter
# =============================================================================
# Circuit breaker auto-config disabled — we create instances programmatically
# in Resilience4jConfig to compose multiple patterns per client.
resilience4j.circuitbreaker.enabled=false
resilience4j.bulkhead.enabled=false
resilience4j.timelimiter.enabled=false

# Retry auto-config kept — used via @Retry annotation in some services.
resilience4j.retry.enabled=true
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.enable-exponential-backoff=true

# Aspect order (kept for any @CircuitBreaker annotations that may be added later)
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

# Rate limiter — protects expensive LLM/scan-triggering endpoints from abuse.
# Fail fast (timeout-duration=0) rather than queueing callers.
resilience4j.ratelimiter.instances.candidateScan.limit-for-period=5
resilience4j.ratelimiter.instances.candidateScan.limit-refresh-period=1m
resilience4j.ratelimiter.instances.candidateScan.timeout-duration=0

resilience4j.ratelimiter.instances.llmAnalysis.limit-for-period=5
resilience4j.ratelimiter.instances.llmAnalysis.limit-refresh-period=1m
resilience4j.ratelimiter.instances.llmAnalysis.timeout-duration=0

resilience4j.ratelimiter.instances.sentimentAnalysis.limit-for-period=5
resilience4j.ratelimiter.instances.sentimentAnalysis.limit-refresh-period=1m
resilience4j.ratelimiter.instances.sentimentAnalysis.timeout-duration=0
# Minimum interval between requests to any selected market-data provider.
market-data.rate-limit-ms=${MARKET_DATA_RATE_LIMIT_MS:250}
data.backfill.parallelism=${DATA_BACKFILL_PARALLELISM:5}
data.backfill.chunk-days=${DATA_BACKFILL_CHUNK_DAYS:365}
data.rate-limit.upstox.requests-per-minute=${DATA_RATE_LIMIT_UPSTOX_RPM:100}
data.rate-limit.fyers.requests-per-minute=${DATA_RATE_LIMIT_FYERS_RPM:60}
data.rate-limit.default.requests-per-minute=${DATA_RATE_LIMIT_DEFAULT_RPM:30}
