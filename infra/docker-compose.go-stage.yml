services:
  api:
    image: swing-trade-go-api:stage
    container_name: swing-trade-stage-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.go-stage
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the authorized database}
      SERVER_PORT: "8080"
      HTTP_HOST: "0.0.0.0"
      API_ADMIN_DISABLED: "true"
      API_KEY_AUTH_ENABLED: "false"
      API_PUBLIC_RATE_LIMIT_PER_MINUTE: ${API_PUBLIC_RATE_LIMIT_PER_MINUTE:-100}
      CORS_ALLOWED_ORIGINS: ${GO_STAGE_CORS_ALLOWED_ORIGINS:-http://piworm.local:8082}
      TZ: Asia/Kolkata
    networks:
      stage:
        aliases:
          - swing-trade-stage-api
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    mem_limit: 1g
    cpus: 1.5

networks:
  stage:
    external: true
    name: swing-trade_swingtrade-network
