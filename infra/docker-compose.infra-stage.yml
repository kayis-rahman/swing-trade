services:
  postgres:
    image: postgres:16
    container_name: swing_trade_stage_postgres
    restart: always
    environment:
      POSTGRES_DB: swingtrade_stage
      POSTGRES_USER: swingtrade_user
      POSTGRES_PASSWORD: swingtrade_password
    ports:
      - "5436:5432"
    volumes:
      - postgres_stage_data:/var/lib/postgresql/data
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrade_user -d swingtrade_stage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: swing-trade-api:stage
    container_name: swing-trade-stage-api
    restart: always
    env_file:
      - env/.env.stage
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-stage
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stage
      - DB_HOST=swing_trade_stage_postgres
      - DB_PORT=5432
      - DB_NAME=swingtrade_stage
      - DB_USER=swingtrade_user
      - DB_PASSWORD=swingtrade_password
      - LANGCHAIN4J_OPEN_AI_API_KEY=${LANGCHAIN4J_OPEN_AI_API_KEY:-}
      - API_KEY_AUTH_ENABLED=true
      - API_KEY=${API_KEY:?API_KEY must be set for the stage API}
      # 1.25 GiB heap within the 2 GiB container budget leaves room for
      # metaspace, code cache, thread stacks, direct buffers, and native libs.
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx1280m
      - LOG_FILE=/var/log/swing-trade/stage.log
      - TZ=Asia/Kolkata
    volumes:
      - stage_logs:/var/log/swing-trade
      # Read-only key for PiLlamaServerManager's SSH calls to the Pi host.
      - /home/dietpi/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swingtrade-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    mem_limit: 2g
    cpus: 1.5

  dashboard:
    image: swing-trade-dashboard:stage
    container_name: swing-trade-stage-dashboard
    restart: always
    build:
      # Deployment copies the dashboard artifact and Dockerfile into this
      # stage directory, so the build context must stay inside it.
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - swingtrade-network

networks:
  swingtrade-network:
    driver: bridge

volumes:
  postgres_stage_data:
  stage_logs:
