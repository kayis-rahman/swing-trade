# LLM backend selection is configured above with the provider defaults.

# llama.cpp Pi SSH Configuration
llamacpp.ssh.user=dietpi
llamacpp.ssh.host=192.168.0.100
llamacpp.port=8090
llamacpp.idle-timeout=300
# Measured, not guessed: 3 threads was tried and reverted. On this 4-core Pi
# it bought only 13% (sentiment 606s -> 527s on an identical 5841-char prompt)
# while pushing load average to 4.1-5.5 and peak temp to 78C — which is exactly
# PiThermalGuard's backoff threshold, so the guard would start deferring runs
# and hand the gain straight back. Inference here is memory-bandwidth bound
# rather than compute bound, which is why extra threads scale so poorly; model
# size is the effective lever, not thread count.
llamacpp.threads=2
llamacpp.context=4096

# Sentiment Analysis Configuration
llm.sentiment.prompt.system=You are a financial analyst specialising in Indian equity markets. Analyse the following for a swing trade entry decision on {symbol}.
