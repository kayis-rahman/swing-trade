name: pg-dev-shared

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: pg-dev
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "max_connections=80"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_DEV_SUPERUSER_PASSWORD:?set in the operator secrets file}"
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - type: volume
        source: pg_dev_data
        target: /var/lib/postgresql/data
      - type: bind
        source: /home/dietpi/shared-postgres/config/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
      - type: bind
        source: /home/dietpi/shared-postgres/config/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
      - type: bind
        source: /home/dietpi/shared-postgres/tls
        target: /etc/postgresql/tls
        read_only: true
    ports:
      - "192.168.0.100:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2G"
    labels:
      com.firstmate.stack: shared-postgres
      com.firstmate.component: postgres
      com.firstmate.environment: dev
    logging: *default-logging
    networks: [pg_dev]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: pg-dev-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${PG_DEV_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=verify-full"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "192.168.0.100:9187:9187"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
    labels:
      com.firstmate.stack: shared-postgres
      com.firstmate.component: postgres-exporter
      com.firstmate.environment: dev
    logging: *default-logging
    networks: [pg_dev]

  backup:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: pg-dev-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: "${PG_DEV_SUPERUSER_PASSWORD:?set in the operator secrets file}"
      PGSSLMODE: require
      PG_DEV_DATABASES: "${PG_DEV_DATABASES:?comma-or-space separated list}"
    volumes:
      - type: bind
        source: /home/dietpi/shared-postgres/backups/pg-dev
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        while :; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          ok=1
          for db in $${PG_DEV_DATABASES}; do
            daily="/backups/pg-dev-$${db}-daily-$${stamp}.dump"
            if PGPASSWORD="$${PGPASSWORD}" pg_dump --host="$${PGHOST}" --port="$${PGPORT}" --username="$${PGUSER}" --format=custom --file="$${daily}" "$${db}"; then
              chmod 600 "$${daily}"
              if [ "$$(date -u +%u)" = "7" ]; then
                weekly="/backups/pg-dev-$${db}-weekly-$${stamp}.dump"
                cp "$${daily}" "$${weekly}"
                chmod 600 "$${weekly}"
              fi
            else
              rm -f "$${daily}"
              ok=0
              echo "pg-dev backup failed for $${db}; retrying in 300 seconds" >&2
              break
            fi
          done
          if [ "$$ok" = "1" ]; then
            cd /backups
            for db in $${PG_DEV_DATABASES}; do
              ls -1 "pg-dev-$${db}-daily-"*.dump 2>/dev/null | sort -r | tail -n +8 | xargs -r rm -f --
              ls -1 "pg-dev-$${db}-weekly-"*.dump 2>/dev/null | sort -r | tail -n +5 | xargs -r rm -f --
            done
            echo "pg-dev backup complete: $${stamp}"
            sleep 86400
          else
            sleep 300
          fi
        done
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
    labels:
      com.firstmate.stack: shared-postgres
      com.firstmate.component: backup
      com.firstmate.environment: dev
    logging: *default-logging
    networks: [pg_dev]

volumes:
  pg_dev_data:
    name: pg_dev_data

networks:
  pg_dev:
    name: pg_dev_net
    driver: bridge
