services:
  api:
    image: swing-trade-api:stage
    container_name: swing-trade-stage-api
    restart: always
    env_file:
      - env/.env.stage
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-stage
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stage
      - DB_HOST=192.168.0.100
      - DB_PORT=5433
      - DB_NAME=swingtrade_stage
      - LANGCHAIN4J_OPEN_AI_API_KEY=${LANGCHAIN4J_OPEN_AI_API_KEY:-}
      - API_KEY_AUTH_ENABLED=true
      - API_KEY=${API_KEY:?API_KEY must be set for the stage API}
      # Half the 1 GiB container budget remains for JVM/native memory.
      - JAVA_TOOL_OPTIONS=-Xmx512m
      - LOG_FILE=/var/log/swing-trade/stage.log
      - TZ=Asia/Kolkata
    volumes:
      - stage_logs:/var/log/swing-trade
      # Read-only key for PiLlamaServerManager's SSH calls to the Pi host.
      - /home/dietpi/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    networks:
      - swingtrade-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    mem_limit: 1g
    cpus: 1.5

  dashboard:
    image: swing-trade-dashboard:stage
    container_name: swing-trade-stage-dashboard
    restart: always
    build:
      # Deployment copies the dashboard artifact and Dockerfile into this
      # stage directory, so the build context must stay inside it.
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - swingtrade-network

networks:
  swingtrade-network:
    driver: bridge

volumes:
  stage_logs:
