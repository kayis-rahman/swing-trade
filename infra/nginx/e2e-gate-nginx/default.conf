# =============================================================================
# Swing Trade dashboard - nginx config for the local E2E gate
# =============================================================================
# Same shape as infra/nginx/dashboard-nginx/default.conf, with one difference
# that matters: the upstream is the compose service name `api` instead of the
# stage container name `swing-trade-stage-api`. Hard-coding a container name
# would couple the gate stack to the stage deployment, and would silently send
# the gate's API calls to stage if the wrong network were ever attached.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes must resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Actuator health through the dashboard so the gate can prove the
    # whole browser path (nginx -> API) without bypassing nginx.
    location /api/actuator/ {
        proxy_pass http://api:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /api/health {
        proxy_pass http://api:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend (pass full URI as-is)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /fyers/ {
        proxy_pass http://api:8080/fyers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No long-lived caching in the gate: a stale asset would mask a broken build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}