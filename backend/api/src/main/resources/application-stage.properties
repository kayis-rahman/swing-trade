# =============================================================================
# Swing Trade Application - Stage Configuration
# =============================================================================
# Stage environment: isolated DB, real market data, paper trading only
# Runs on pi-node alongside dev with separate volumes and ports
# =============================================================================

# =============================================================================
# Database Configuration (Stage - isolated from dev)
# =============================================================================
# Stage uses port 5436, database swingtrade_stage, volume postgres_data_stage
spring.datasource.url=jdbc:postgresql://${DB_HOST:swing_trade_stage_postgres}:${DB_PORT:5432}/${DB_NAME:swingtrade_stage}
spring.datasource.username=${DB_USER:swingtrade_user}
spring.datasource.password=${DB_PASSWORD:swingtrade_password}

# Stage connection pool settings
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Flyway enabled for stage — migrations run on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# Server Configuration
# =============================================================================
# Container listens on 8080; external port 8081 is handled by docker port mapping
# server.port=8081 intentionally omitted — keep internal port standard

# =============================================================================
# Fyers API Configuration
# =============================================================================
# Credentials and tokens are supplied by infra/env/.env.stage at runtime.
fyers.clientId=${FYERS_CLIENT_ID:}
fyers.secretKey=${FYERS_SECRET_KEY:}
fyers.redirectUrl=${FYERS_REDIRECT_URL:http://piworm.local:8082/api/fyers/callback}
fyers.pin=${FYERS_PIN:}
fyers.accessToken=${FYERS_ACCESS_TOKEN:}
fyers.refreshToken=${FYERS_REFRESH_TOKEN:}
fyers.tokenStorePath=${FYERS_TOKEN_STORE_PATH:/app/data/fyers-tokens.json}
fyers.frontend-url=${FYERS_FRONTEND_URL:http://piworm.local:8082}

# =============================================================================
# Trading Configuration (Paper trading only)
# =============================================================================
trading.enabled=true
trading.paper.trading.enabled=true
real.trading.enabled=false
trading.simulation.mode=true

# Stage trading limits — same as production for realistic testing
ingestion.reconcile.apply.enabled=${INGESTION_RECONCILE_APPLY_ENABLED:false}
reconcile.apply.token=${RECONCILE_APPLY_TOKEN:}
trading.max.position.size.percentage=10
trading.max.exposure.percentage=50
trading.stop.loss.percentage=5.0
trading.take_profit.percentage=15.0
trading.min.signal.confidence=60.0

# =============================================================================
# Strategy Configuration
# =============================================================================
strategy.enabled=true
strategy.decision.threshold=60
strategy.max.open.positions=5

# =============================================================================
# LLM / vLLM Configuration (Spring AI 2.0.1)
# =============================================================================
spring.ai.openai.base-url=${LLM_BASE_URL:http://localhost:8000}
spring.ai.openai.chat.model=${LLM_MODEL_NAME:claude-sonnet-4-6}
spring.ai.openai.chat.temperature=0.0
spring.ai.openai.timeout=${LLM_TIMEOUT:30s}
spring.ai.openai.chat.max-tokens=4096
llm.base-url=${LLM_BASE_URL:http://localhost:8000/v1}

# Dummy key — Spring AI's OpenAI auto-configuration requires *some* credential to construct
# its client bean even though this app doesn't use OpenAI's hosted API (uses local vLLM/gpuhub instead)
spring.ai.openai.api-key=${OPENAI_API_KEY:not-needed}

llm.retry.enabled=true
llm.retry.max-attempts=3
llm.retry.backoff.millis=1000
llm.retry.exponential-backoff=true

# =============================================================================
# Logging Configuration (Stage — moderate verbosity)
# =============================================================================
logging.level.root=INFO
logging.level.com.swingtrade=INFO
logging.level.com.swingtrade.api=INFO
logging.level.com.swingtrade.data=INFO
logging.level.com.swingtrade.strategy=INFO
logging.level.com.swingtrade.llm=INFO
logging.level.com.swingtrade.broker=INFO
logging.level.com.swingtrade.core=INFO

# These sources currently require explicit stage validation before enabling.
news.source.bse.enabled=${NEWS_BSE_ENABLED:false}
news.source.reddit.enabled=${NEWS_REDDIT_ENABLED:false}
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# Stage log file — persist for review
logging.file.name=${LOG_FILE:/var/log/swing-trade/stage.log}
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# Actuator / Health Check
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,prometheus,info,flyway
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10485760

# =============================================================================
# Signal Notifications (Stage — enable for testing)
# =============================================================================
signal.enabled=${SIGNAL_ENABLED:false}
signal.api.token=${SIGNAL_API_TOKEN:}
signal.chat.id=${SIGNAL_CHAT_ID:}
signal.notify.on.trades=true
signal.notify.on.signals=false
signal.notify.on.errors=true

# =============================================================================
# Feature Flags
# =============================================================================
app.features.data-ingestion.enabled=false
app.features.strategy.enabled=true
app.features.sentiment-analysis.enabled=true
app.features.paper-trading.enabled=true
app.features.real-trading.enabled=false
app.features.scheduler.enabled=true
app.features.candidate-scan.scheduler.enabled=true

# =============================================================================
# Job Orchestrator
# =============================================================================
job.orchestrator.max-concurrent=3
job.orchestrator.poll-interval-ms=3000
job.orchestrator.reaper.enabled=true
job.orchestrator.reaper.initial-delay-ms=15000
job.orchestrator.reaper.interval-ms=300000
job.orchestrator.llm-analysis.enabled=${LLM_ANALYSIS_ENABLED:true}
job.orchestrator.llm-analysis.advisory-only=${LLM_ANALYSIS_ADVISORY_ONLY:true}

# =============================================================================
# CORS (Stage — allow pi-node and local dev dashboard)
# =============================================================================
spring.web.cors.allowed-origins=http://localhost:3000,http://piworm.local:8081,http://127.0.0.1:8081
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allowed-credentials=true

# =============================================================================
# Security
app.security.api-key.enabled=${API_KEY_AUTH_ENABLED:true}
app.security.api-key=${API_KEY:}
app.security.public-rate-limit-per-minute=${API_PUBLIC_RATE_LIMIT_PER_MINUTE:100}
# =============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# =============================================================================
# Monitoring
# =============================================================================
app.monitoring.enabled=true
app.monitoring.metrics.interval.seconds=60
app.monitoring.health.interval.seconds=30

# =============================================================================
# Discord Webhook (optional)
# =============================================================================
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
discord.webhook.enabled=${DISCORD_WEBHOOK_ENABLED:false}

# =============================================================================
# SpringDoc / Swagger (disabled in stage)
# =============================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
