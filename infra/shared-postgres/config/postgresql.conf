# Shared Postgres common configuration (used by both pg-dev and pg-prod).
# Runtime values that differ per container are supplied via docker compose command/env.
listen_addresses = '*'
port = 5432

# Authentication and TLS
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
ssl_ca_file = '/etc/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Shared baseline tuning; overrides per container through command line.
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
max_connections = 80

fsync = on
synchronous_commit = on
full_page_writes = on

timezone = 'UTC'
