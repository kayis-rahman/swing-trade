# =============================================================================
# Swing Trade Application - Main Configuration
# =============================================================================
# Spring Boot Application Configuration
# =============================================================================

# Server Configuration
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Application Info
spring.application.name=swing-trade-api

candidate-scan.backfill-years=5
candidate-scan.delay-ms=1000
candidate-scan.max-concurrent=3
spring.main.allow-bean-definition-overriding=true

# =============================================================================
# Database Configuration (PostgreSQL + TimescaleDB)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swingtrade_db}?currentSchema=public
spring.datasource.username=${DB_USER:swingtrade_user}
spring.datasource.password=${DB_PASSWORD:swingtrade_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SwingTradeHikariCP
spring.datasource.hikari.auto-commit=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
# Hibernate 7.4.5 (Spring Boot 4.1.1 BOM) auto-detection is unreliable/intermittent
# against this TimescaleDB-patched PostgreSQL: it occasionally mis-selects H2Dialect
# and crashes parsing Postgres's Debian-format version string ("PostgreSQL 16.14
# (Debian 16.14-1.pgdg13+1)..."). Explicit dialect avoids the auto-detection path.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.time_zone=Asia/Kolkata

# Flyway Configuration (disabled for local dev - TimescaleDB not installed)
spring.flyway.enabled=false

# =============================================================================
# Upstox API Configuration
# =============================================================================
upstox.api.base-url=https://api.upstox.com
upstox.client-id=${UPSTOX_CLIENT_ID:}
upstox.client-secret=${UPSTOX_CLIENT_SECRET:}
upstox.redirect-uri=${UPSTOX_REDIRECT_URI:http://localhost:8080/auth/upstox/callback}
upstox.access-token=${UPSTOX_ACCESS_TOKEN:}
upstox.token-store-path=${UPSTOX_TOKEN_STORE_PATH:data/upstox-tokens.json}

