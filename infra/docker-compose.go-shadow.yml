# No-traffic Go shadow API for the watchlist comparison run.
# This file is deliberately separate from docker-compose.go-stage.yml: the stage
# deployment contract in bin/verify-go-stage-deployment.sh asserts that file's
# container name (swing-trade-stage-api) and port mapping (8081:8080), and the
# shadow service must never replace it.
services:
  api:
    image: swing-trade-go-api:shadow
    container_name: swing-trade-go-shadow-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.go-stage
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      HTTP_HOST: "0.0.0.0"
      API_KEY_AUTH_ENABLED: "true"
      API_KEY: ${API_KEY:?API_KEY must be set for the Go shadow API}
      API_PUBLIC_RATE_LIMIT_PER_MINUTE: ${API_PUBLIC_RATE_LIMIT_PER_MINUTE:-100}
      CORS_ALLOWED_ORIGINS: ${GO_STAGE_CORS_ALLOWED_ORIGINS:-http://piworm.local:8082}
      # The Go read-only pool only accepts the captain-authorized development
      # database; a valid comparison needs Java and Go on the same database.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for the Go shadow API}
      TZ: Asia/Kolkata
    networks:
      stage:
        aliases:
          - swing-trade-go-shadow-api
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    mem_limit: 1g
    cpus: 1.5

networks:
  stage:
    external: true
    # The network the running stage dashboard container uses
    # (docker-compose.infra-stage.yml project network); nginx resolves the
    # shadow alias through Docker's embedded DNS on this network.
    name: swing-trade_swingtrade-network
